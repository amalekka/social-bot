name: Telegram Bot 24/7 Hosting

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

concurrency:
  group: telegram-bot-runner
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install pyTelegramBotAPI yt-dlp "urllib3<3.0"

      - name: Run Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          # حلقة حماية: إذا توقف البوت لأي سبب يعيد تشغيله فوراً طوال مدة الـ 5 ساعات (18000 ثانية)
          timeout 18000 bash -c 'while true; do python -u main.py; echo "Restarting bot in 2s..."; sleep 2; done' || exit 0
