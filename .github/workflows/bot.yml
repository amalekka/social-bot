name: Telegram Bot 24/7 Hosting

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

# هذا السطر يضمن إغلاق أي نسخة قديمة شغالة تلقائياً لمنع خطأ Conflict 409
concurrency:
  group: telegram-bot-runner
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install pyTelegramBotAPI yt-dlp "urllib3<3.0"

      - name: Run Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          # يعمل لمدة 5 ساعات متواصلة ثم ينهي المهمة بعلامة صح خضراء ويعيد تشغيل نفسه
          timeout 18000 python -u main.py || exit 0
