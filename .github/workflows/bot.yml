name: Telegram Bot 24/7 Hosting

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: telegram-bot-runner
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. مسح السجلات القديمة
      - name: Clean Old Action Logs
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          CURRENT_RUN_ID=${{ github.run_id }}
          gh run list --workflow=bot.yml --limit 50 --json databaseId -q ".[].databaseId" | while read -r id; do
            if [ "$id" != "$CURRENT_RUN_ID" ]; then
              gh run delete "$id" || true
            fi
          done

      # 2. تفعيل Cloudflare WARP لتغيير IP سيرفر GitHub المحظور في يوتيوب
      - name: Setup Cloudflare WARP
        uses:ouraigua/setup-warp@v1
        continue-on-error: true

      # 3. إعداد بايثون
      - name: Set up Python with Cache
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # 4. تثبيت المكتبات وتشغيل سيرفر توليد تذاكر يوتيوب (PO Token Server) في الخلفية
      - name: Install Dependencies & Start PO Token Server
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg nodejs npm
          python -m pip install --upgrade pip
          python -m pip install pyTelegramBotAPI "urllib3<3.0"
          python -m pip install --force-reinstall -U --pre "yt-dlp[default]"
          python -m pip install -U bgutil-ytdlp-pot-provider
          
          # تحميل وتشغيل سيرفر فك حظر يوتيوب في الخلفية على بورت 4416
          git clone --single-branch --branch 0.7.2 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git /tmp/pot-server
          cd /tmp/pot-server/server
          npm install
          npx tsc
          nohup node build/main.js > /dev/null 2>&1 &
          sleep 3

      # 5. تشغيل البوت
      - name: Run Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          timeout 18000 bash -c 'while true; do python -u main.py; sleep 1; done' || exit 0

      # 6. إطلاق الجلسة التالية فور الانتهاء
      - name: Trigger Next Run Immediately
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          gh workflow run bot.yml --ref main
