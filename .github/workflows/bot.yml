name: Telegram Bot 24/7 Hosting

on:
  push:
    branches: [ main ]
  schedule:
    # يتم إعادة التشغيل تلقائياً كل ساعتين لضمان استقرار السجلات ونظافة السيرفر
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install --upgrade pip
          pip install pytelegrambotapi==4.14.0 yt-dlp==2023.12.30 urllib3<3.0

      - name: Run Bot 
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          # تشغيل البوت لمدة ساعتين (7200 ثانية) ثم إعادة التشغيل بسلام لتحديث السجلات
          timeout 7200 python main.py || true
